[project]
name = "victus-habit-tracker"
version = "0.1.0"
description = "Local-first habit/session tracker for Victus-style personal habit timers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
]

[project.scripts]
habit = "habit_tracker.cli:main"
habit-timer = "habit_tracker.timer:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
